name: Secret scanning
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_CONFIG_TOML: |
        [extend]
        useDefault = true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan tracked files, all reachable history and commit metadata (redacted)
        shell: bash
        run: |
          set -euo pipefail
          tree=$(mktemp -d)
          trap 'rm -rf "$tree"' EXIT
          git ls-files -z | tar --null -T - -cf - | tar -xf - -C "$tree"
          status=0
          "$RUNNER_TEMP/gitleaks" dir "$tree" --redact=100 --no-banner || status=1
          "$RUNNER_TEMP/gitleaks" git . --log-opts="--all --full-history -m" --redact=100 --no-banner || status=1
          # 默认规则跳过锁文件；stdin 扫描避免路径排除。
          "$RUNNER_TEMP/gitleaks" stdin --redact=100 --no-banner < package-lock.json || status=1
          git log --all --full-history -m -p --format=fuller -- package-lock.json | "$RUNNER_TEMP/gitleaks" stdin --redact=100 --no-banner || status=1
          git log --all --format=raw | "$RUNNER_TEMP/gitleaks" stdin --redact=100 --no-banner || status=1
          git for-each-ref refs/tags --format='%(contents)' | "$RUNNER_TEMP/gitleaks" stdin --redact=100 --no-banner || status=1
          exit "$status"
